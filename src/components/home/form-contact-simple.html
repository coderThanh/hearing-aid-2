<form id="contactFormSimple" action="#" method="POST" data-toggle="validator" class="wow fadeInUp"
    data-wow-delay="0.25s">
    <div class="row">
        <div class="form-group  mb-4">
            <input type="text" name="name" class="form-control" id="fullname"
                placeholder="Họ và tên *" required="">
            <div class="help-block with-errors"></div>
        </div>
        <div class="form-group  mb-4">
            <input type="text" name="phone" class="form-control" id="phone"
                placeholder="Số điện thoại*" required="">
            <div class="help-block with-errors"></div>
        </div>
        <div class="form-group col-md-12 mb-4">
            <select name="services" class="form-control form-select" id="services" required>
                <option value="" disabled selected>Chọn chi nhánh *</option>
                <option value="hcm">Chi nhánh Hồ Chí Minh</option>
                <option value="ha_noi">Chi nhánh Hà Nội</option>
            </select>
            <div class="help-block with-errors"></div>
                 <input type="hidden" name="message"  value="">
        </div>
        <div class="col-md-12">
            <button type="submit" class="btn-default">Đăng ký ngay</button>
        </div>
    </div>
</form>
